<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OGVRP Admin Logs</title>
  <style>
    body { background:#0b0b10; color:#f5f5f5; font-family:system-ui; margin:0; }
    .shell { max-width:900px; margin:40px auto; padding:0 16px; }
    .card { background:#15151d; border-radius:8px; padding:16px; margin-bottom:12px; }
    .header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .badge { opacity:0.8; font-size:0.9rem; }
    .timestamp { font-size:0.8rem; opacity:0.7; }
    .details { margin-top:8px; font-size:0.9rem; display:none; }
    .details.show { display:block; }
    input[type=password] { background:#15151d; border:1px solid #333; color:#f5f5f5; padding:8px; border-radius:4px; width:200px; }
    button { background:#2b2b3a; color:#f5f5f5; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="shell">
    <h1>Admin Logs</h1>
    <p>Enter admin password to view logs.</p>
    <input id="adminPassword" type="password" placeholder="Password">
    <button id="adminLogin">Unlock</button>
    <div id="filters" style="margin-top:24px; display:none;">
  <h2>Filters</h2>

  <label>Officer name:</label>
  <input id="filterName" type="text" placeholder="Search name">

  <label>Department:</label>
  <select id="filterDept">
    <option value="">All</option>
    <option value="WSP">WSP</option>
    <option value="OCSO">OCSO</option>
    <option value="NPS">NPS</option>
  </select>

  <label>Rank:</label>
  <input id="filterRank" type="text" placeholder="Search rank">

  <label>Badge:</label>
  <input id="filterBadge" type="text" placeholder="Search badge">

  <label>From date:</label>
  <input id="filterFrom" type="date">

  <label>To date:</label>
  <input id="filterTo" type="date">

  <button id="applyFilters">Apply filters</button>
  <button id="clearFilters">Clear</button>
</div>

    <div id="logsContainer" style="margin-top:24px;"></div>
  </div>

  <script>
    const ADMIN_HASH = "0000"; // placeholder, replace with a real hash later

    const supabaseUrl = "https://YOUR_PROJECT.supabase.co";
    const supabaseKey = "YOUR_ADMIN_KEY"; // use a key allowed to SELECT

    document.getElementById("adminLogin").onclick = async () => {
      const pwd = document.getElementById("adminPassword").value.trim();
      if (pwd !== "0000") return; // simple check; replace with hash compare later

      const res = await fetch(`${supabaseUrl}/rest/v1/reports?select=*`, {
        headers: {
          apikey: supabaseKey,
          Authorization: `Bearer ${supabaseKey}`
        }
      });
      const data = await res.json();
      renderLogs(data);
    };

    function renderLogs(logs) {
      const container = document.getElementById("logsContainer");
      container.innerHTML = "";
      logs
        .sort((a,b) => b.timestamp - a.timestamp)
        .forEach(log => {
          const card = document.createElement("div");
          card.className = "card";

          const header = document.createElement("div");
          header.className = "header";
          header.innerHTML = `
            <div>
              <strong>${log.officer_name}</strong> | ${log.officer_rank}
              <span class="badge">${log.officer_badge || ""}</span>
            </div>
            <div class="timestamp">${new Date(log.timestamp).toLocaleString()}</div>
          `;

          const details = document.createElement("div");
          details.className = "details";
          details.textContent = `Department: ${log.officer_dept}`;

          header.onclick = () => {
            details.classList.toggle("show");
          };

          card.appendChild(header);
          card.appendChild(details);
          container.appendChild(card);
        });
    }
  </script>
</body>
</html>
